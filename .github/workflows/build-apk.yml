# APK 를 GitHub 가 대신 빌드해 Releases 에 붙인다.
#
# ★손으로 돌리는 것이 아니라 올릴 때마다 돈다. 안드로이드 스튜디오를 켜지 않아도
#   폰에 넣을 파일이 늘 준비되어 있다.
# ★디버그 서명이다. 안드로이드가 만들어 주는 열쇠로 서명하므로 곧바로 설치된다.
#   (서명 없는 release APK 는 설치 자체가 안 된다.)
# ★API 키는 APK 에 들어가지 않는다 — 앱을 처음 켤 때 사람이 넣는다.

name: APK 빌드

on:
  push:
    branches: [main]
  # 필요할 때 손으로도 돌릴 수 있게 (Actions 탭 → Run workflow)
  workflow_dispatch:

permissions:
  contents: write        # Releases 에 파일을 붙이려면 필요하다

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ★지난 판 이후 무엇이 바뀌었는지 쓰려면 **역사와 태그가 다 있어야 한다.**
      #   기본값(fetch-depth: 1)이면 커밋이 하나뿐이라 릴리즈 노트가 통째로 빈다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ★검사가 깨지면 APK 를 만들지 않는다. NAI 페이로드가 틀리면 돈만 쓰고
      #   다른 그림이 나오므로, 나가는 파일은 검사를 통과한 것이어야 한다.
      - name: 검사
        run: |
          npm ci
          npm test

      - name: JDK 21 준비
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 안드로이드 SDK 준비
        uses: android-actions/setup-android@v3

      # ★실패하면 끝부분을 주석(annotation)으로도 남긴다. 로그 전문은 로그인해야
      #   보이는데 주석은 밖에서도 읽힌다 — 무엇이 깨졌는지 알아내겠다고 매번
      #   다시 돌리는 일을 없앤다.
      - name: 웹 파일을 안드로이드 쪽으로 옮기기
        run: |
          set +e
          npx cap sync android > sync.log 2>&1
          code=$?
          cat sync.log
          if [ $code -ne 0 ]; then
            echo "::error::cap sync 실패($code) — $(tail -c 1200 sync.log | tr '\n\r' '~~')"
            exit $code
          fi

      # ★판 번호를 **실행 횟수에서 뽑지 않는다.** 실행 횟수는 저장소마다 따로 세는데
      #   이 워크플로는 두 저장소가 똑같이 나눠 쓴다. 그래서 "1.2.$((실행 - 21))" 같은
      #   식을 쓰면 한쪽에서는 맞고 다른 쪽에서는 어긋난다 — 실제로 실행 6번짜리
      #   저장소가 **v1.2.-15** 를 내놓았다. 음수 판 번호는 앱의 업데이트 확인도
      #   망가뜨린다 (버전을 쪼갤 때 '-' 가 구분자로 먹혀 1.2.15 로 읽힌다).
      #
      #   이미 붙어 있는 태그 중 제일 높은 것에서 하나 올린다. 저장소가 몇 개든,
      #   실행 횟수가 몇이든 맞는다. (태그를 다 받아 오려고 fetch-depth: 0 을 쓴다.)
      - name: 판 번호 새기기
        run: |
          RUN=${{ github.run_number }}
          # 숫자 셋으로 된 태그만 본다. 손으로 붙인 이상한 태그에 끌려가지 않게.
          LAST=$(git tag -l 'v*' | sed 's/^v//' \
            | awk -F. 'NF==3 && $1 ~ /^[0-9]+$/ && $2 ~ /^[0-9]+$/ && $3 ~ /^[0-9]+$/' \
            | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          LAST=${LAST:-1.2.0}
          MAJ=${LAST%%.*}; REST=${LAST#*.}; MIN=${REST%%.*}; PAT=${REST#*.}
          NAME="$MAJ.$MIN.$((PAT + 1))"
          echo "지난 판 $LAST → 이번 판 $NAME"
          # ★versionCode 는 실행 횟수를 그대로 쓴다. 저장소 안에서는 늘 늘어나므로
          #   덮어 설치가 막히지 않는다 (안드로이드는 이 숫자가 줄면 설치를 거부한다).
          sed -i "s/versionCode 1/versionCode $((RUN + 1))/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$NAME\"/" android/app/build.gradle
          echo "VERSION_NAME=$NAME" >> $GITHUB_ENV
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: APK 빌드
        run: |
          set +e
          chmod +x android/gradlew
          (cd android && ./gradlew assembleDebug --no-daemon) > build.log 2>&1
          code=$?
          cat build.log
          if [ $code -ne 0 ]; then
            echo "::error::gradle 실패($code) — $(tail -c 1200 build.log | tr '\n\r' '~~')"
            exit $code
          fi

      - name: 이름 붙이기
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/peropix-lkit-${{ env.VERSION_NAME }}.apk"
          ls -lh out/

      # Actions 탭에서도 받을 수 있게 (Release 를 안 만들더라도)
      - name: 산출물 올리기
        uses: actions/upload-artifact@v4
        with:
          name: peropix-lkit-apk
          path: out/*.apk

      # ★"뭐가 바뀐 판인지" 를 릴리즈에 적는다. 파일만 올려 두면 받는 사람은 판 번호만
      #   보고 깔지 말지를 정해야 한다. 커밋 제목을 그대로 쓰고, 자세한 설명은 접어 둔다.
      - name: 이번 판에 바뀐 것 모으기
        run: tools/release_notes.sh > out/NOTES.md

      - name: Release 에 붙이기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          # ★태그를 **이 빌드가 만들어진 커밋**에 붙인다. 이걸 빼면 GitHub 이 태그를
          #   기본 브랜치(main) 끝에 만들어 버린다 — APK 는 브랜치에서 나왔는데 태그와
          #   소스 묶음(zip)은 다른 코드를 가리키게 되고, "지난 판 이후 무엇이 바뀌었나"
          #   도 계산할 수 없다. 실제로 v1.0.6~v1.0.9 가 그렇게 붙어 있었다.
          target_commitish: ${{ github.sha }}
          name: Peropix Lkit ${{ env.VERSION_NAME }}
          body_path: out/NOTES.md
          files: out/*.apk
